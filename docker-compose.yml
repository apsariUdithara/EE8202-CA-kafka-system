# Local Kafka stack for the EE8202 order pipeline.
#
#   docker compose up -d              broker + schema registry + topics + UI
#   docker compose --profile apps up  ... and the producer/consumer in containers
#
# The broker advertises two listeners: 'kafka:9092' for containers on this
# network and 'localhost:29092' for apps run from the host.

name: ee8202-kafka

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: ee8202-kafka
    ports:
      - "29092:29092"
    environment:
      # --- KRaft: a single node acting as both broker and controller ---------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # --- Single-node development settings ---------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init, never by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: ee8202-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # BACKWARD compatibility: a new schema must still read old messages.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: ee8202-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      ORDERS_TOPIC: orders
      DLQ_TOPIC: orders.DLQ
      AGGREGATES_TOPIC: orders.aggregates
      ORDERS_PARTITIONS: "3"
    volumes:
      - ./scripts:/scripts:ro
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ee8202-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ee8202
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"

  # --- Optional: run the pipeline itself in containers (profile "apps") ------
  producer:
    profiles: ["apps"]
    build: .
    image: ee8202-order-pipeline:latest
    container_name: ee8202-producer
    depends_on:
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    command: ["order-producer", "--rate", "2"]
    restart: unless-stopped

  consumer:
    profiles: ["apps"]
    build: .
    image: ee8202-order-pipeline:latest
    container_name: ee8202-consumer
    depends_on:
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    command: ["order-consumer"]
    restart: unless-stopped

volumes:
  kafka-data:
