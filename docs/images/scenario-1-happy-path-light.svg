<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 526" width="960" height="526" role="img" aria-labelledby="t d">
<title id="t">Scenario 1: A good order</title>
<desc id="d">The order is unpacked, checked, handed to the downstream system and counted, so the running average moves. The offset is then stored, and every so often the current average is published to orders.aggregates.</desc>
