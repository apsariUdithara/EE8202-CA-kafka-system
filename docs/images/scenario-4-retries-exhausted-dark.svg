<rect x="280.5" y="314.0" width="171.0" height="28.0" rx="7" fill="#2A2012" stroke="#E3A33B" stroke-width="1.1"/>
<text x="366.0" y="332.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">wait, then try again</text>
<rect x="266.2" y="370.0" width="199.6" height="28.0" rx="7" fill="#2A1614" stroke="#F0776A" stroke-width="1.1"/>
<text x="366.0" y="388.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">4 attempts used: give up</text>
