<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" width="960" height="576" role="img" aria-labelledby="t d">
<title id="t">Scenario 5: A crash loses nothing</title>
<desc id="d">An order is only marked done after the consumer has finished with it. After a crash the consumer restarts from its last saved position: nothing is lost, though the last few orders may be processed twice.</desc>
<defs>
<marker id="m-flow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9D1D9"/></marker>
<marker id="m-teal-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3FC1A5"/></marker>
<marker id="m-red-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0776A"/></marker>
<marker id="m-amber-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E3A33B"/></marker>
</defs>
<rect x="0.8" y="0.8" width="958.5" height="574.5" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#9DA7B3" text-anchor="start" letter-spacing="1.2">SCENARIO 5</text>
<text x="24.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="start">A crash loses nothing</text>
<line x1="176.0" y1="130" x2="176.0" y2="554" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="88.0" y="80.0" width="176.0" height="50.0" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
<text x="176.0" y="102.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Producer</text>
<text x="176.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">order-producer</text>
<line x1="480.0" y1="130" x2="480.0" y2="554" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="392.0" y="80.0" width="176.0" height="50.0" rx="9" fill="#161B22" stroke="#6E7681" stroke-width="1.2"/>
<text x="480.0" y="102.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">orders</text>
<text x="480.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">3 partitions</text>
<line x1="784.0" y1="130" x2="784.0" y2="554" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="696.0" y="80.0" width="176.0" height="50.0" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
<text x="784.0" y="102.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Consumer</text>
<text x="784.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">order-consumer</text>
<path d="M180.0,176 H474.0" stroke="#C9D1D9" stroke-width="2" fill="none" marker-end="url(#m-flow-dark)"/>
<rect x="249.5" y="154.0" width="157.0" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="328.0" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">orders keep arriving</text>
<path d="M484.0,222 H778.0" stroke="#C9D1D9" stroke-width="2" fill="none" marker-end="url(#m-flow-dark)"/>
<rect x="610.7" y="200.0" width="42.6" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="632.0" y="214.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">poll</text>
<rect x="677.0" y="234.0" width="213.9" height="28.0" rx="7" fill="#0F2620" stroke="#3FC1A5" stroke-width="1.1"/>
<text x="784.0" y="252.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">processed · offsets stored</text>
<path d="M30,294 H930" stroke="#F0776A" stroke-width="1.6" stroke-dasharray="8 6"/>
<rect x="388.7" y="282.0" width="182.6" height="24.0" rx="12" fill="#2A1614" stroke="#F0776A" stroke-width="1.1"/>
<text x="480.0" y="298.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#F0776A" text-anchor="middle">the consumer crashes</text>
<path d="M180.0,356 H474.0" stroke="#C9D1D9" stroke-width="2" fill="none" marker-end="url(#m-flow-dark)"/>
<rect x="231.6" y="334.0" width="192.8" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="328.0" y="348.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">still writing · lag grows</text>
<path d="M30,386 H930" stroke="#3FC1A5" stroke-width="1.6" stroke-dasharray="8 6"/>
<rect x="384.7" y="374.0" width="190.5" height="24.0" rx="12" fill="#0F2620" stroke="#3FC1A5" stroke-width="1.1"/>
<text x="480.0" y="390.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3FC1A5" text-anchor="middle">the consumer restarts</text>
<path d="M780.0,448 H486.0" stroke="#C9D1D9" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#m-flow-dark)"/>
<rect x="564.2" y="426.0" width="135.6" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="632.0" y="440.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">where did I stop?</text>
<path d="M484.0,494 H778.0" stroke="#C9D1D9" stroke-width="2" fill="none" marker-end="url(#m-flow-dark)"/>
<rect x="507.0" y="472.0" width="250.0" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="632.0" y="486.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">resume from the last saved offset</text>
<rect x="632.3" y="506.0" width="299.7" height="28.0" rx="7" fill="#0F2620" stroke="#3FC1A5" stroke-width="1.1"/>
<text x="782.1" y="524.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">nothing lost · the last few may repeat</text>
</svg>
