<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 708" width="960" height="708" role="img" aria-labelledby="t d">
<title id="t">Scenario 2: A temporary failure is retried</title>
<desc id="d">The downstream system is briefly unavailable. The consumer waits and tries again, doubling the pause each time. When delivery finally succeeds, the order is counted in the average exactly once.</desc>
