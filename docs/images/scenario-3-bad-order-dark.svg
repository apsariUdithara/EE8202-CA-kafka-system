<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" width="960" height="434" role="img" aria-labelledby="t d">
<title id="t">Scenario 3: A bad order skips the retries</title>
<desc id="d">Bytes that are not Avro, or a price below zero, can never succeed. Retrying would only hold up the orders behind it, so the message goes straight to the dead letter queue with its original bytes and the reason.</desc>
<defs>
<marker id="m-flow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9D1D9"/></marker>
<marker id="m-teal-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3FC1A5"/></marker>
<marker id="m-red-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0776A"/></marker>
<marker id="m-amber-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E3A33B"/></marker>
</defs>
<rect x="0.8" y="0.8" width="958.5" height="432.5" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#9DA7B3" text-anchor="start" letter-spacing="1.2">SCENARIO 3</text>
<text x="24.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="start">A bad order skips the retries</text>
<line x1="138.0" y1="130" x2="138.0" y2="412" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="50.0" y="80.0" width="176.0" height="50.0" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
<text x="138.0" y="102.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Producer</text>
<text x="138.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">order-producer</text>
<line x1="366.0" y1="130" x2="366.0" y2="412" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="278.0" y="80.0" width="176.0" height="50.0" rx="9" fill="#161B22" stroke="#6E7681" stroke-width="1.2"/>
<text x="366.0" y="102.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">orders</text>
<text x="366.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">3 partitions</text>
<line x1="594.0" y1="130" x2="594.0" y2="412" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="506.0" y="80.0" width="176.0" height="50.0" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
<text x="594.0" y="102.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Consumer</text>
<text x="594.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">order-consumer</text>
<line x1="822.0" y1="130" x2="822.0" y2="412" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="734.0" y="80.0" width="176.0" height="50.0" rx="9" fill="#2A1614" stroke="#F0776A" stroke-width="1.2"/>
<text x="822.0" y="102.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">orders.DLQ</text>
<text x="822.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9DA7B3" text-anchor="middle">dead letters</text>
<path d="M142.0,176 H360.0" stroke="#F0776A" stroke-width="2" fill="none" marker-end="url(#m-red-dark)"/>
<rect x="130.6" y="154.0" width="242.8" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="252.0" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#F0776A" text-anchor="middle">corrupt bytes, or price = −42.00</text>
<path d="M370.0,222 H588.0" stroke="#C9D1D9" stroke-width="2" fill="none" marker-end="url(#m-flow-dark)"/>
<rect x="458.7" y="200.0" width="42.6" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="480.0" y="214.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">poll</text>
<rect x="429.9" y="234.0" width="328.3" height="28.0" rx="7" fill="#2A1614" stroke="#F0776A" stroke-width="1.1"/>
<text x="594.0" y="252.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">decode ✗   or   validate ✗   →   permanent</text>
<rect x="433.4" y="276.0" width="321.2" height="28.0" rx="7" fill="#2A1614" stroke="#F0776A" stroke-width="1.1"/>
<text x="594.0" y="294.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">no retry: the same bytes would fail again</text>
<path d="M598.0,352 H816.0" stroke="#F0776A" stroke-width="2" fill="none" marker-end="url(#m-red-dark)"/>
<rect x="579.5" y="330.0" width="257.1" height="19.0" rx="4" fill="#0D1117" stroke="none" stroke-width="1.2"/>
<text x="708.0" y="344.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#F0776A" text-anchor="middle">original bytes + reason in headers</text>
<rect x="437.0" y="364.0" width="314.0" height="28.0" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1.1"/>
<text x="594.0" y="382.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="middle">offset stored: move on to the next order</text>
</svg>
